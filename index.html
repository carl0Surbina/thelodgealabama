<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weddings at The Lodge Alabama — Pricing Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --linen:#F5F2EC;
    --linen-2:#ECE8DF;
    --forest:#1E2A21;
    --forest-soft:#4A5D4E;
    --hunter:#3A5443;
    --hunter-deep:#2D3D32;
    --bark:#A89070;
    --moss:#2D3D32;
    --line:#D4CEC2;
    --white:#FDFCF8;
    --danger:#8B4040;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Source Sans 3',sans-serif;
    background:var(--linen);
    color:var(--forest);
    font-size:16px;line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Spectral',serif;font-weight:500;line-height:1.08;}
  img{display:block;max-width:100%;}
  a{color:inherit;}

  .wrap{max-width:1080px;margin:0 auto;padding:0 28px;}
  .rule{height:1px;background:var(--line);border:0;}

  /* ── TOP UTILITY BAR ── */
  .util{ background:var(--moss); }
  .util-inner{
    max-width:1080px;margin:0 auto;padding:7px 28px;
    display:flex;justify-content:space-between;align-items:center;gap:1rem;
    font-size:.72rem;letter-spacing:.04em;color:#C4CBBF;
  }
  .util a{color:#C4CBBF;text-decoration:none;}
  .util a:hover{color:#fff;}
  .util .util-right{display:flex;gap:1.4rem;align-items:center;}
  @media(max-width:620px){.util .util-hide{display:none;}}

  /* ── NAV ── */
  nav.bar{
    position:sticky;top:0;z-index:50;
    background:rgba(244,237,226,.88);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .bar-inner{
    max-width:1080px;margin:0 auto;padding:0 28px;height:68px;
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
  }
  .bar-logos{display:flex;align-items:center;gap:.85rem;}
  .bar-logo{display:flex;align-items:center;text-decoration:none;}
  .bar-logo img{height:28px;width:auto;display:block;}
  .bar-logo.cse img{height:30px;}
  .bar-logo-div{width:1px;height:26px;background:var(--line);}
  .bar-right{display:flex;align-items:center;gap:.7rem;}
  .bar-cta{/* kept for specificity */}
  .burger{
    display:flex;align-items:center;justify-content:center;
    width:42px;height:42px;border-radius:999px;border:1px solid var(--hunter);
    background:var(--hunter);color:var(--white);cursor:pointer;
    transition:background .2s;flex-shrink:0;
  }
  .burger:hover{background:var(--hunter-deep);}
  .burger svg{width:18px;height:18px;}
  .bar-menu{
    display:none;position:absolute;top:68px;left:0;right:0;z-index:49;
    background:var(--white);border-bottom:1px solid var(--line);
    box-shadow:0 12px 36px rgba(30,42,33,.12);
    padding:1.2rem 0;
  }
  .bar-menu.open{display:block;}
  .bar-menu a{
    display:block;padding:.75rem 32px;
    font-size:.82rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
    color:var(--forest-soft);text-decoration:none;transition:color .15s,background .15s;
  }
  .bar-menu a:hover{color:var(--hunter);background:var(--linen-2);}
  .btn{
    display:inline-block;font-family:'Source Sans 3',sans-serif;
    font-size:.74rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    padding:.7rem 1.3rem;border-radius:999px;border:1px solid var(--hunter);
    background:var(--hunter);color:var(--white);text-decoration:none;cursor:pointer;
    transition:background .2s,transform .15s;
  }
  .btn:hover{background:var(--hunter-deep);}
  .btn-ghost{background:transparent;color:var(--hunter);}
  .btn-ghost:hover{background:var(--hunter);color:var(--white);}

  /* ── HERO ── */
  .hero{
    position:relative;min-height:54vh;display:flex;align-items:flex-start;
    background-color:var(--moss);
    background-size:cover;background-position:center top;
  }
  .hero::before{
    content:'';position:absolute;inset:0;z-index:1;
    background:rgba(28,20,14,.3);
    pointer-events:none;
  }
  .hero.noimg::before{display:none;}
  .hero.noimg{
    background-image:linear-gradient(155deg,#1A2E22 0%,var(--moss) 45%,#0F1A14 100%);
  }
  .hero-inner{position:relative;z-index:2;max-width:1100px;margin:0;padding:2.8rem clamp(24px,6vw,80px) 2rem;width:100%;color:var(--white);display:flex;flex-direction:column;min-height:54vh;}
  .hero-logo{display:block;max-width:clamp(350px,70vw,830px);height:auto;margin-bottom:1rem;}
  .hero-sub{
    margin-top:auto;font-size:1.3rem;color:#F0EDE6;max-width:34ch;font-weight:400;line-height:1.5;
    text-shadow:0 1px 14px rgba(30,42,33,.55);
  }
  .hero.noimg .hero-sub{text-shadow:none;}

  @media(max-width:760px){
  .hero-logo{max-width:90vw;}
  .hero-sub{font-size:.95rem;}
  }

  /* ── SECTION SCAFFOLD ── */
  section{padding:5rem 0;}
  .sec-head{max-width:62ch;}
  .sec-head h2{font-size:clamp(1.9rem,4vw,2.9rem);color:var(--forest);}
  .sec-head p{margin-top:1rem;color:var(--forest-soft);font-size:1.02rem;}
  .center{text-align:center;margin-left:auto;margin-right:auto;}

  /* ── INTRO ── */
  .intro{padding:4.5rem 0 3rem;text-align:center;}
  .intro h2{font-size:clamp(1.7rem,3.4vw,2.4rem);max-width:20ch;margin:0 auto;}
  .intro p{max-width:54ch;margin:1.1rem auto 0;color:var(--forest-soft);font-size:1.05rem;}
  .intro .tag{
    margin-top:1.6rem;display:inline-block;font-size:.8rem;color:var(--forest-soft);
    border:1px solid var(--line);border-radius:999px;padding:.4rem 1rem;background:var(--white);
  }

  /* ── MEET KYLEE ── */
  .guide-grid{display:grid;grid-template-columns:.7fr 1.3fr;gap:3rem;align-items:center;}
  .guide-photo{display:flex;justify-content:center;}
  .guide-photo .avatar{
    width:200px;height:200px;border-radius:50%;object-fit:cover;object-position:center top;
    border:4px solid var(--white);box-shadow:0 6px 24px rgba(30,42,33,.18);
    outline:1px solid var(--line);
  }
  .guide-photo .monogram{
    width:200px;height:200px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%,var(--bark),#C28F6C);
    color:var(--white);font-family:'Spectral',serif;font-size:5rem;font-weight:500;
    border:4px solid var(--white);box-shadow:0 6px 24px rgba(30,42,33,.18);
    outline:1px solid var(--line);
  }
  .guide-body h2{font-size:clamp(1.8rem,3.6vw,2.6rem);}
  .guide-role{color:var(--hunter);font-weight:600;font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;margin-top:.3rem;}
  .guide-body p{margin-top:1.1rem;color:var(--forest-soft);font-size:1.04rem;}
  .guide-sign{font-family:'Spectral',serif;font-style:italic;font-size:1.4rem;color:var(--forest);margin-top:1.2rem;}
  @media(max-width:760px){.guide-grid{grid-template-columns:1fr;gap:1.6rem;text-align:center;}}

  /* ── STARTING SNAPSHOT ── */
  .snap{background:var(--linen-2);}
  .snap-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;margin-top:2.4rem;}
  .snap-card{
    background:var(--white);border:1px solid var(--line);border-radius:6px;
    padding:2.2rem 2rem;text-align:center;
  }
  .snap-card .season{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--forest-soft);font-weight:600;}
  .snap-card .months{font-size:.8rem;color:var(--bark);margin-top:.2rem;font-weight:500;}
  .snap-card .startlabel{font-size:.8rem;color:var(--forest-soft);margin-top:1.1rem;font-style:italic;font-family:'Spectral',serif;}
  .snap-card .price{font-family:'Spectral',serif;font-size:3.6rem;font-weight:500;color:var(--hunter);line-height:1;margin-top:.1rem;}
  .snap-card .price sup{font-size:1.4rem;vertical-align:super;top:-.2em;}
  .snap-range{
    text-align:center;margin-top:2rem;font-size:1rem;color:var(--forest-soft);max-width:52ch;margin-left:auto;margin-right:auto;
  }
  .snap-range b{color:var(--forest);font-weight:600;}
  @media(max-width:620px){.snap-grid{grid-template-columns:1fr;}}

  /* ── WHAT'S INCLUDED ── */
  .incl-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:3rem;align-items:center;}
  .incl-grid.noimg{grid-template-columns:1fr;max-width:760px;margin-left:auto;margin-right:auto;text-align:center;}
  .incl-grid.noimg .incl-list{text-align:left;}
  .incl-photo img{width:100%;border-radius:4px;}
  .incl-photo .cap{font-size:.74rem;color:var(--forest-soft);margin-top:.6rem;font-style:italic;font-family:'Spectral',serif;}
  .incl-list{columns:2;column-gap:1.6rem;margin-top:.4rem;}
  .incl-list li{
    list-style:none;break-inside:avoid;font-size:.92rem;color:var(--forest);
    padding:.5rem 0 .5rem 1.5rem;position:relative;border-bottom:1px solid var(--line);
  }
  .incl-list li::before{content:'';position:absolute;left:0;top:.95rem;width:7px;height:7px;border-radius:50%;background:var(--hunter);}
  @media(max-width:760px){.incl-grid{grid-template-columns:1fr;gap:1.6rem;}.incl-list{columns:1;}}

  .incl-dark{background:var(--moss);}
  .incl-dark h2{color:#fff;}
  .incl-dark .incl-list li{color:#E0E8E2;border-bottom-color:#3D4F42;}
  .incl-dark .incl-list li::before{background:var(--bark);}
  .incl-dark .incl-photo .cap{color:#B0BBA8;}

  /* ── PRICING TABLES ── */
  .price-wrap{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;margin-top:2.4rem;}
  .ptable{background:var(--white);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .ptable-head{padding:1.1rem 1.4rem;display:flex;justify-content:space-between;align-items:baseline;}
  .ptable-head.high{background:var(--hunter);}
  .ptable-head.low{background:var(--moss);}
  .ptable-head .s{font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;}
  .ptable-head .m{font-size:.72rem;color:#ffffffcc;}
  table{width:100%;border-collapse:collapse;font-size:.86rem;}
  thead th{font-family:'Source Sans 3',sans-serif;font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--forest-soft);padding:.7rem .6rem;text-align:right;border-bottom:1px solid var(--line);}
  thead th:first-child{text-align:left;padding-left:1.4rem;}
  tbody td{padding:.7rem .6rem;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--forest);border-bottom:1px solid var(--linen-2);}
  tbody td:first-child{text-align:left;padding-left:1.4rem;font-weight:500;color:var(--forest-soft);}
  tbody tr:last-child td{border-bottom:0;}
  .ptable-foot{padding:.7rem 1.4rem 1rem;font-size:.74rem;color:var(--forest-soft);}
  @media(max-width:720px){.price-wrap{grid-template-columns:1fr;}}

  /* ── ADD-ONS ── */
  .addons{background:var(--linen-2);}
  .addon-list{margin-top:2rem;max-width:680px;margin-left:auto;margin-right:auto;}
  .addon-row{
    display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
    padding:1rem 0;border-bottom:1px solid var(--line);
  }
  .addon-row:last-child{border-bottom:0;}
  .addon-name{font-size:.92rem;color:var(--forest);font-weight:500;}
  .addon-name .sub{display:block;font-size:.78rem;color:var(--forest-soft);font-weight:400;}
  .addons .wrap{max-width:720px;}
  .addon-price{font-family:'Spectral',serif;font-size:1.15rem;color:var(--hunter);font-weight:500;white-space:nowrap;}

  /* ── WINE BAND ── */
  .grapeband{
    position:relative;text-align:center;color:#fff;padding:5.5rem 0;
    background-color:var(--forest);
    background-image:linear-gradient(180deg,rgba(25,35,28,.62),rgba(25,35,28,.66));
    background-size:cover;background-position:center;
  }
  .grapeband.noimg{
    background-image:linear-gradient(120deg,#3A2417 0%,var(--forest) 60%,#1F140C 100%);
  }
  .grapeband h2{color:#fff;font-size:clamp(1.8rem,4vw,2.8rem);max-width:20ch;margin-left:auto;margin-right:auto;text-shadow:0 2px 18px rgba(0,0,0,.45);}
  .grapeband p{color:#F0EDE6;max-width:50ch;margin:1rem auto 0;font-weight:400;text-shadow:0 1px 12px rgba(0,0,0,.5);}
  .grapeband.noimg h2,.grapeband.noimg p{text-shadow:none;}

  /* ── TYPICAL SPEND ── */
  .spend-section{background:var(--moss);color:#fff;padding:5rem 0;}
  .spend-section h2{color:#fff;}
  .spend-section .sec-head p{color:#C4CBBF;}

  /* ── SMALLER CELEBRATIONS (cards) ── */
  .mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;margin-top:2.4rem;}
  .mini-card{background:var(--white);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;}
  .mini-card .ph{height:150px;background-size:cover;background-position:center;}
  .mini-card .ph.noimg{height:8px;background:var(--hunter);}
  .mini-card .bd{padding:1.4rem;flex:1;display:flex;flex-direction:column;}
  .mini-card h3{font-size:1.45rem;}
  .mini-card .p{font-family:'Spectral',serif;font-size:2.1rem;color:var(--hunter);font-weight:500;line-height:1;margin:.2rem 0 .1rem;}
  .mini-card .p sup{font-size:.9rem;vertical-align:super;}
  .mini-card .meta{font-size:.82rem;color:var(--forest-soft);margin-bottom:.8rem;}
  .mini-card .desc{font-size:.86rem;color:var(--forest-soft);border-top:1px solid var(--line);padding-top:.8rem;margin-top:auto;}
  @media(max-width:760px){
    .mini-grid{grid-template-columns:1fr;}
    .mini-card{flex-direction:row;}
    .mini-card .ph{width:38%;height:auto;}
    .mini-card .ph.noimg{width:8px;height:auto;}
    .mini-card .bd{flex:1;}
  }

  /* ── TASTING ROOM strip ── */
  .tr{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:stretch;margin-top:3rem;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--white);}
  .tr.noimg{grid-template-columns:1fr;}
  .tr .ph{background-size:cover;background-position:center;min-height:280px;background-color:var(--linen-2);}
  .tr h3{font-size:1.7rem;}
  .tr .bd{padding:2.4rem;}
  .tr .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:1.2rem;}
  .tr .mi{border-top:1px solid var(--line);padding-top:.6rem;}
  .tr .mi .l{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--forest-soft);}
  .tr .mi .v{font-family:'Spectral',serif;font-size:1.2rem;color:var(--forest);}
  @media(max-width:720px){.tr{grid-template-columns:1fr;}}

  /* ── DUO SLIDER (Typical spend  ⇄  Micro weddings) ── */
  .duo{position:relative;padding:0;overflow:hidden;}
  .duo-track{
    display:flex;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
    height:auto;transition:height .35s ease;scrollbar-width:none;
  }
  .duo-track::-webkit-scrollbar{display:none;}
  .duo-slide{flex:0 0 100%;scroll-snap-align:start;align-self:flex-start;}
  .duo-slide>.wrap{padding-top:5rem;padding-bottom:5.5rem;}
  .duo-slide.spend{background:var(--moss);color:var(--linen);}
  .duo-slide.micro-slide{background:var(--linen);}

  .duo-hint{
    position:absolute;top:18px;right:18px;z-index:6;
    display:inline-flex;align-items:center;gap:.45rem;
    background:var(--hunter);color:#fff;font-size:.64rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    padding:.45rem .9rem;border-radius:999px;box-shadow:0 4px 14px rgba(30,42,33,.25);
    animation:nudge 1.8s ease-in-out infinite;transition:opacity .3s;
  }
  .duo-hint svg{width:13px;height:13px;}
  .duo-hint.gone{opacity:0;pointer-events:none;}
  @keyframes nudge{0%,100%{transform:translateX(0);}50%{transform:translateX(5px);}}

  .duo-arrow{
    position:absolute;top:46%;z-index:5;width:46px;height:46px;border-radius:50%;
    border:none;cursor:pointer;background:var(--white);color:var(--hunter);
    box-shadow:0 4px 16px rgba(30,42,33,.22);
    display:flex;align-items:center;justify-content:center;
    transition:opacity .25s,transform .15s;
  }
  .duo-arrow svg{width:20px;height:20px;}
  .duo-arrow:hover{transform:scale(1.07);}
  .duo-arrow.prev{left:16px;}
  .duo-arrow.next{right:16px;}
  .duo-arrow[hidden]{display:none;}

  .duo-dots{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:.5rem;}
  .duo-dots .dot{width:9px;height:9px;border-radius:50%;border:none;padding:0;cursor:pointer;background:#B0BBA8;opacity:.55;transition:.2s;}
  .duo-dots .dot.active{background:var(--hunter);opacity:1;transform:scale(1.2);}
  @media(prefers-reduced-motion:reduce){.duo-hint{animation:none;}.duo-track{scroll-behavior:auto;transition:none;}}
  @media(max-width:560px){.duo-arrow{width:40px;height:40px;}.duo-arrow.prev{left:8px;}.duo-arrow.next{right:8px;}}

  /* spend slide internals */
  .spend h2{color:#fff;}
  .spend .sec-head p{color:#C4CBBF;}
  .spend-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;margin-top:2.6rem;}
  .spend-card{border:1px solid #3D4F42;border-radius:6px;padding:1.8rem;background:#2F4035;}
  .spend-card .t{font-family:'Spectral',serif;font-size:1.4rem;color:#fff;}
  .spend-card .g{font-size:.78rem;color:var(--bark);letter-spacing:.04em;margin-top:.1rem;}
  .spend-card .r{font-family:'Spectral',serif;font-size:2rem;color:#fff;margin-top:1rem;line-height:1;}
  .spend-card .r span{font-size:.9rem;color:#C4CBBF;}
  .spend-card .d{font-size:.84rem;color:#C4CBBF;margin-top:.8rem;border-top:1px solid #3D4F42;padding-top:.8rem;}
  .spend-note{text-align:center;margin-top:2rem;font-size:.86rem;color:#B0BBA8;max-width:60ch;margin-left:auto;margin-right:auto;font-style:italic;font-family:'Spectral',serif;}
  @media(max-width:760px){.spend-grid{grid-template-columns:1fr;}}

  /* ── CTA ── */
  .cta{
    position:relative;text-align:center;color:#fff;padding:6rem 0;
    background-color:var(--forest);
    background-image:linear-gradient(180deg,rgba(30,42,33,.55),rgba(30,42,33,.78));
    background-size:cover;background-position:center;
  }
  .cta.noimg{
    background-image:linear-gradient(150deg,var(--hunter-deep) 0%,#5E2614 55%,var(--forest) 100%);
  }
  .cta h2{color:#fff;font-size:clamp(2rem,5vw,3.4rem);max-width:18ch;margin-left:auto;margin-right:auto;}
  .cta p{color:#EDE9E2;max-width:46ch;margin:1rem auto 2rem;font-weight:300;}
  .cta-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
  .cta .btn-ghost{color:#fff;border-color:#fff;}
  .cta .btn-ghost:hover{background:#fff;color:var(--forest);}

  /* ── FINE PRINT ── */
  .terms{padding:4.5rem 0;background:var(--olive,#3A3430);color:#E8E0D6;}
  .terms .sec-head h2{font-size:2.2rem;color:#fff;letter-spacing:.04em;text-transform:uppercase;}
  .terms .sec-head p{color:#C4B8AA;}
  .terms-disclaimer{display:flex;align-items:center;gap:.7rem;justify-content:center;margin-bottom:2.4rem;padding:1rem 1.8rem;margin-top:1rem;border:1px solid rgba(255,255,255,.15);border-radius:4px;background:rgba(255,255,255,.06);max-width:fit-content;margin-left:auto;margin-right:auto;}
  .terms-disclaimer svg{flex-shrink:0;opacity:.7;}
  .terms-disclaimer span{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.65);}
  .terms-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.2rem;margin-top:.5rem;}
  .term{border-left:3px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);border-radius:0 4px 4px 0;padding:1.1rem 1.3rem;}
  .term .l{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:700;}

  /* ── FOOTER ── */

  footer .managed{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#7B8F7E;margin-bottom:.9rem;}
  footer .cselogo{height:48px;width:auto;margin:0 auto;opacity:.95;}
  .guide-btn{margin-top:1.5rem;display:inline-block;}
  footer .csewordmark{font-family:'Spectral',serif;font-size:1.15rem;color:#B0BBA8;}
  /* ── BUYOUT DETAILS ── */
  .buyout-strip{background:var(--moss);padding:2.4rem 0;}
  .buyout-inner{max-width:760px;margin:0 auto;}
  .buyout-inner h3{font-family:'Spectral',serif;font-size:1.3rem;font-weight:500;color:#fff;margin-bottom:1rem;}

  .act-card{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:1.6rem;display:flex;flex-direction:column;}
  .act-card h3{font-family:'Spectral',serif;font-size:1.25rem;font-weight:500;color:var(--forest);}
  .act-card .act-price{font-family:'Spectral',serif;font-size:1.4rem;color:var(--hunter);font-weight:500;margin:.2rem 0;}

  .act-card .act-desc{font-size:.84rem;color:var(--forest-soft);margin-top:.8rem;border-top:1px solid var(--line);padding-top:.8rem;flex:1;}
  .act-card.coming{opacity:.7;}

  /* ── PRIVATE EVENTS ── */

  .pvt-addon-row .p{font-family:'Spectral',serif;color:var(--hunter);font-weight:500;white-space:nowrap;}

  .staff-access:hover{opacity:1;color:var(--hunter);}
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease;}
  .reveal.in{opacity:1;transform:none;}

  /* ── LOGIN ── */

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--forest);color:#fff;padding:.7rem 1.3rem;border-radius:8px;font-size:.85rem;opacity:0;pointer-events:none;transition:.3s;z-index:200;box-shadow:0 8px 24px rgba(30,42,33,.25);}

  .sched-modal{
    background:var(--linen);border:1px solid var(--line);border-radius:10px;
    max-width:440px;width:100%;padding:2.2rem 1.9rem 1.9rem;position:relative;
    box-shadow:0 24px 60px rgba(42,28,18,.28);
  }
  .sched-modal h3{font-size:1.25rem;margin-bottom:1.5rem;line-height:1.35;padding-right:1.4rem;}
  .sched-close{
    position:absolute;top:.9rem;right:1rem;background:none;border:none;cursor:pointer;
    color:var(--forest-soft);font-size:1.5rem;line-height:1;padding:.2rem;font-family:inherit;
  }
  .sched-close:hover{color:var(--forest);}
  .sched-actions{display:flex;flex-direction:column;gap:.8rem;margin-bottom:1.7rem;}
  .sched-actions .btn{width:100%;text-align:center;}
  .sched-actions .btn.disabled{
    background:var(--line);border-color:var(--line);color:var(--forest-soft);
    cursor:not-allowed;pointer-events:none;opacity:.8;
  }
  .sched-footer{border-top:1px solid var(--line);padding-top:1.2rem;text-align:center;font-size:.85rem;color:var(--forest-soft);}
  .sched-footer .sched-terms-btn{
    margin-top:.45rem;background:none;border:none;color:var(--hunter);text-decoration:underline;
    cursor:pointer;font-size:.85rem;font-family:inherit;padding:0;
  }
  .sched-footer .sched-terms-btn:hover{color:var(--hunter-deep);}
</style>

/* ---------- HELPERS ---------- */
const app = document.getElementById('app');
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
function toast(msg, dur=2400){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), dur);
}
const configured = () => BIN_ID && API_KEY && !BIN_ID.includes('PASTE') && !API_KEY.includes('PASTE');

/* ---------- DATA ---------- */
let DATA = null;
let authed = false;
let currentView = null;

async function load(force){
  if(DATA && !force) return;                 // fetch once, then reuse cached copy
  if(!configured()){ DATA = JSON.parse(JSON.stringify(DEFAULT_DATA)); return; }
  const res = await fetch(READ_URL, { headers:{ 'X-Master-Key': API_KEY } });
  if(!res.ok){
    let detail = '';
    try { detail = (await res.text()).slice(0,160); } catch(_){}
    const hint = res.status===429 ? ' — JSONBin rate limit hit; wait ~30 seconds and reload'
              : res.status===401||res.status===403 ? ' — key not accepted for this bin'
              : res.status===404 ? ' — bin ID not found' : '';
    throw new Error('JSONBin returned ' + res.status + hint + (detail?(' · '+detail):''));
  }
  const json = await res.json();
  DATA = json.record;
}
async function save(){
  if(!configured()) throw new Error('Not connected to JSONBin yet — add your Bin ID and key.');
  const res = await fetch(WRITE_URL, {
    method: 'PUT',
    headers:{ 'Content-Type':'application/json', 'X-Master-Key': API_KEY },
    body: JSON.stringify(DATA)
  });
  if(!res.ok) throw new Error('Failed to save: ' + res.status);
}

/* ---------- ROUTER ---------- */
async function route(){
  const isAdmin = location.hash.replace('#','').toLowerCase()==='admin';
  if(!DATA){                                  // only fetch when we have nothing cached
    try {
      app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;"><div style="font-family:'Spectral',serif;font-size:1.4rem;color:var(--forest-soft);">Loading…</div></div>`;
      currentView = null;
      await load();
    } catch(e){
      showError(e.message); return;
    }
  }
  if(isAdmin){
    authed ? renderAdmin() : renderLogin();
    currentView = 'admin';
  } else {
    if(currentView !== 'public'){             // don't re-render on in-page anchor clicks
      try { renderPublic(); }
      catch(e){ showError('Page error: ' + e.message); return; }
      currentView = 'public';
    }
  }
}
function showError(msg){
  currentView = null;
  app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;"><div><div style="font-family:'Spectral',serif;font-size:1.4rem;color:var(--forest-soft);margin-bottom:.5rem;">Unable to load</div><div style="font-size:.85rem;color:var(--forest-soft);max-width:42ch;">${esc(msg)}</div></div></div>`;
}
window.addEventListener('hashchange', route);

function bg(url, overlay){ return url ? `style="background-image:${overlay},url('${esc(url)}');"` : ''; }

/* ============================================================
   SCHEDULE A TOUR MODAL
   Replaces default browser alerts/prompts. Private Event button
   is enabled/disabled dynamically based on whether a private
   events booking URL exists for this venue.
   ============================================================ */
function openScheduleModal(){
  const ov = document.getElementById('scheduleOverlay');
  if(!ov) return;
  ov.classList.add('open');
  ov.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
}
function closeScheduleModal(){
  const ov = document.getElementById('scheduleOverlay');
  if(!ov) return;
  ov.classList.remove('open');
  ov.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
}
function goToVenueTerms(){
  closeScheduleModal();
  const el = document.getElementById('venue-terms');
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}
function configureScheduleModal(weddingUrl, privateUrl){
  const wBtn = document.getElementById('scheduleWeddingBtn');
  const pBtn = document.getElementById('schedulePrivateBtn');
  if(wBtn){
    wBtn.href = weddingUrl || '#';
  }
  if(pBtn){
    pBtn.dataset.privateUrl = privateUrl || '';
    if(privateUrl){
      pBtn.href = privateUrl;
      pBtn.textContent = 'Private Event';
      pBtn.classList.remove('disabled');
      pBtn.removeAttribute('aria-disabled');
      pBtn.removeAttribute('tabindex');
    } else {
      pBtn.removeAttribute('href');
      pBtn.textContent = '(Coming Soon)';
      pBtn.classList.add('disabled');
      pBtn.setAttribute('aria-disabled','true');
      pBtn.setAttribute('tabindex','-1');
    }
  }
}
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeScheduleModal(); });

  $$('.reveal').forEach(el=>io.observe(el));

function tf(id, label, value, hint){
  return `<div class="field"><label>${label}</label><input id="${id}" value="${esc(value)}">${hint?`<div class="hint">${hint}</div>`:''}</div>`;
}
function ta(id, label, value){
  return `<div class="field"><label>${label}</label><textarea id="${id}" rows="3">${esc(value)}</textarea></div>`;
}
function ta2(id, label, value){
  return `<div class="field"><label>${label}</label><textarea id="${id}" rows="2">${esc(value)}</textarea></div>`;
}
function imgf(id, label, value){
  return `<div class="field"><label>${label}</label><input id="${id}" value="${esc(value)}" placeholder="https://… (leave blank for fallback)" oninput="imgPreview(this)"><div class="hint">Paste a hosted image URL. Blank = styled fallback.</div>${value?`<img class="img-preview" src="${esc(value)}" alt="preview">`:`<div class="img-preview empty">No image</div>`}</div>`;
}
function imgPreview(el){
  let p=el.parentElement.querySelector('.img-preview');
  if(!p){p=document.createElement('img');p.className='img-preview';el.parentElement.appendChild(p);}
  if(el.value){p.tagName==='DIV'?el.parentElement.replaceChild(Object.assign(document.createElement('img'),{className:'img-preview',src:el.value,alt:'preview'}),p):(p.src=el.value);}
  else{if(p.tagName==='IMG'){const d=document.createElement('div');d.className='img-preview empty';d.textContent='No image';el.parentElement.replaceChild(d,p);}}
}

/* ----- add / delete (preserve unsaved edits first) ----- */
function addItem(kind){
  gather();
  const d=DATA;
  if(kind==='snapcard') d.snapshot.cards.push({season:'New Season',months:'',startlabel:'starting at',price:'0'});
  if(kind==='incitem') d.included.items.push('New item');
  if(kind==='highrow') d.pricing.high.rows.push(['Day','$0']);
  if(kind==='lowrow') d.pricing.low.rows.push(['Package','$0']);
  if(kind==='addon') d.addons.rows.push({name:'New add-on',sub:'',price:'$0'});
  if(kind==='boitem'){ if(!d.buyout) d.buyout={heading:'',items:[]}; d.buyout.items.push('New item'); }
  if(kind==='activity'){ if(!d.outdoor) d.outdoor={heading:'',body:'',activities:[]}; d.outdoor.activities.push({title:'New Activity',price:'$0',duration:'',details:''}); }
  if(kind==='peitem'){ if(!d.privateEvents) d.privateEvents={heading:'',body:'',price:'',items:[],addons:[]}; d.privateEvents.items.push('New item'); }
  if(kind==='peaddon'){ if(!d.privateEvents) d.privateEvents={heading:'',body:'',price:'',items:[],addons:[]}; d.privateEvents.addons.push({name:'New add-on',price:'$0'}); }
  if(kind==='microcard') d.micro.cards.push({title:'New Package',price:'0',meta:'',desc:'',image:''});
  if(kind==='trmeta') d.micro.tasting.meta.push({l:'Label',v:'Value'});
  if(kind==='spendcard') d.spend.cards.push({t:'New Tier',g:'',r:'0',d:''});
  if(kind==='term') d.terms.items.push({l:'Label',body:''});
  renderAdmin();
}
function delItem(kind, i){
  if(!confirm('Delete this item? This can\'t be undone until you reload without saving.')) return;
  gather();
  const d=DATA;
  const map={ snapcard:d.snapshot.cards, incitem:d.included.items, highrow:d.pricing.high.rows,
    lowrow:d.pricing.low.rows, addon:d.addons.rows, microcard:d.micro.cards,
    trmeta:d.micro.tasting.meta, spendcard:d.spend.cards, term:d.terms.items,
    boitem:d.buyout?d.buyout.items:[], activity:d.outdoor?d.outdoor.activities:[],
    peitem:d.privateEvents?d.privateEvents.items:[], peaddon:d.privateEvents?d.privateEvents.addons:[] };
  map[kind].splice(i,1);
  renderAdmin();
}

async function saveAll(){
  const btn=$('#save-all');
  if(!confirm('Save all changes? This will update the live page immediately.')) return;
  try { gather(); } catch(e){ toast(e.message); return; }
  btn.disabled=true; btn.textContent='Saving…';
  try { await save(); toast('✓ Saved — the live page is updated'); }
  catch(e){ toast('Error: '+e.message); }
  btn.disabled=false; btn.textContent='Save all changes';
}
